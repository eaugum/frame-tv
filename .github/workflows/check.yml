# The same check as tools/check.sh, on every pull request and push to main.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Catalogues, Samsung package and ES5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: tools/check.sh
