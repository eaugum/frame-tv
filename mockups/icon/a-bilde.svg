<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- A: the frame with a picture in it (a sunset over the horizon) -->
  <rect width="512" height="512" rx="112" fill="#0A0A0C"/>
  <rect x="88" y="136" width="336" height="240" rx="14" fill="#F4F2EE"/>
  <rect x="120" y="168" width="272" height="176" rx="4" fill="#0A0A0C"/>
  <clipPath id="pic"><rect x="120" y="168" width="272" height="176" rx="4"/></clipPath>
  <g clip-path="url(#pic)">
    <circle cx="256" cy="300" r="64" fill="#F2B84B"/>
    <rect x="120" y="300" width="272" height="44" fill="#0A0A0C"/>
    <rect x="120" y="298" width="272" height="6" fill="#F2B84B"/>
  </g>
</svg>
