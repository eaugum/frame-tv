<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Frame TV</title>
<link rel="stylesheet" href="home.css">
</head>
<body>
<div id="stage">
  <div id="ambient"><div class="amb" id="amb0"></div><div class="amb" id="amb1"></div></div>
  <div class="pane" id="pane-home"></div>
  <div class="pane" id="pane-tv">
    <div id="calm"><div class="big-clock"></div><div class="date"></div><div class="weather"></div></div>
    <div id="hero">
      <div class="frame"><div class="shot" id="shot0"></div><div class="shot" id="shot1"></div><div class="shade"></div></div>
      <div class="content"><div class="hc" id="hc"></div></div>
      <div id="dots"></div>
    </div>
    <div id="rows"></div>
  </div>
  <div class="pane" id="pane-stasera"></div>
  <div class="pane" id="pane-github"></div>
  <div class="pane" id="pane-ha"></div>
  <div class="pane" id="pane-spotify"></div>
  <div class="pane" id="pane-search"></div>
  <div id="top">
    <div id="tabs"></div>
    <div id="clock"></div>
  </div>
  <div id="apps" class="layer sheet"><h2></h2><div class="grid"></div></div>
  <div id="settings" class="layer sheet"><div class="box"></div></div>
  <div id="shelfedit" class="layer sheet"><div class="box"></div></div>
  <div id="langpick" class="layer sheet"><div class="box"></div></div>
  <div id="devpick" class="layer sheet"><div class="box"></div></div>
  <div id="link" class="layer sheet"><div class="box"></div></div>
  <div id="typer" class="layer sheet"><div class="box"></div></div>
  <div id="title" class="layer"></div>
  <div id="saver" class="layer"></div>
  <div id="toast"></div>
</div>
<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="strings.js"></script>
<script src="tv.js"></script>
<script src="zones.js"></script>
<script src="data.js"></script>
<script src="qrcode.js"></script>
<script src="stasera.js"></script>
<script src="github.js"></script>
<script src="youtube.js"></script>
<script src="ha.js"></script>
<script src="spotify.js"></script>
<script src="art.js"></script>
<script src="home.js"></script>
</body>
</html>
