# Settings for Frame TV. The easiest way to fill them in is the setup page: python3 tools/setup.py. Or edit this file
# (tizen/build.py copies it to config.properties the first time) and build again.
#
# Each module has a switch at the top of its section: true turns it on, as long as it has what it needs (a module
# switched on without it stays off); false, empty or missing turns it off, and then it's gone from the TV, apart from
# its page under the gear → Connections.
#
# Everything is optional. This file is the starting point: what you change on the TV (the gear) wins, until you change
# the same setting here again; then the file wins. Whatever was changed last applies.
#
# docs/modules.md explains every setting: what it does, where the value comes from and what happens without it.

# --- Stasera (stasera.app): what you're watching, new episodes, friends and stats ---
# stasera_url has a default, so true is enough. The TV is linked once from the gear → Connections →
# Stasera, with a QR code.
stasera=true
# The address of Stasera's API. Empty = https://www.stasera.app.
stasera_url=https://www.stasera.app
# The TV's name in Stasera's list of linked TVs (empty = "The Frame").
stasera_name=
# The TV's link to Stasera, filled in by "Upload config" on the TV. A new install starts out linked.
stasera_token=

# --- YouTube: new videos from the channels you subscribe to ---
# A tab and a tile on Home. Needs youtube_client_id and youtube_client_secret. The TV signs in once from the gear →
# Connections → YouTube, with a code on google.com/device, and can only read.
youtube=
# An OAuth client in Google Cloud (console.cloud.google.com): turn on YouTube Data API v3, set up Google Auth Platform
# (External, the scope youtube.readonly, and published: in "Testing" the sign-in expires after 7 days) and make a
# client of the type "TVs and Limited Input devices". Both end up in the app on the TV: keep them secret.
youtube_client_id=
youtube_client_secret=
# The TV's sign-in, filled in by "Upload config" on the TV. A new install starts out signed in.
youtube_refresh_token=

# --- GitHub: your commits over the last six months, the languages and the newest projects ---
# Needs github_token. With Vercel on too, the tab shows the deploys as well; each works without the other.
github=
# A fine-grained token from github.com → Settings → Developer settings → Fine-grained tokens, for your own repos, with
# read-only access to Contents and Metadata. It ends up in the app on the TV: keep it secret.
github_token=
# Repos to leave out, comma-separated, by name (without the owner): old-repo,dotfiles
github_hide=

# --- Vercel: the latest deploys, in the GitHub tab ---
# Needs vercel_token.
vercel=
# A token from vercel.com → Account Settings → Tokens. It ends up in the app on the TV: keep it secret.
vercel_token=
# The team on Vercel, by id (team_…) or slug. Empty = the deploys on your own account.
vercel_team=

# --- Home Assistant: lights, electricity, laundry, the guest network, and notifications from Home Assistant ---
# Needs home_assistant_url and home_assistant_token. What the tab shows is picked on the TV: the gear →
# Connections → Home Assistant.
home_assistant=
# The address (for example http://192.168.1.10:8123) and a long-lived token (your profile in Home Assistant →
# Security), preferably for a user of its own. Notifications and what the TV reports need that user to be an admin;
# see docs/home-assistant.md. The token ends up in the app on the TV: keep it secret.
home_assistant_url=
home_assistant_token=
#
# Home Assistant can show a notification on the TV with the event frametv_notify: {title, message, seconds}.

# --- Spotify: what's playing, the controls, and moving the music to the TV ---
# A tab and a tile on Home. Needs spotify_client_id and spotify_refresh_token. Controlling the music needs Premium.
spotify=
# An app at developer.spotify.com/dashboard (Web API, redirect URI http://127.0.0.1:8888/callback). Put its client id
# here, then sign in: "Sign in to Spotify" on the setup page (or python3 tools/spotify_login.py) fills in the token.
# Spotify accepts the token for 6 months; then the TV says so, and you sign in again and reinstall. The token ends up
# in the app on the TV: keep it secret.
spotify_client_id=
spotify_refresh_token=

# --- Art Mode: the Frame Art add-on for Home Assistant (github.com/eaugum/frame-art), which picks the pictures ---
# A tile on Home with what's showing; OK turns on Art Mode, hold OK for a new picture. Needs art_url.
art=
# The add-on's address, for example http://192.168.1.10:8099.
art_url=
# The key to the add-on: api_key on the add-on's Configuration tab in Home Assistant, filled in at its first start.
art_key=

# --- General ---
# The city, for the weather and the sunset that dims the home screen in the evening. "Springfield, US" picks the
# country when the name is in several. Empty = the main city in the TV's time zone.
city=

# Your name, in the greeting on Home ("Good afternoon, Anna") when the TV isn't linked to Stasera. Empty = just
# "Good afternoon".
name=

# auto (the TV's language), nb or en.
language=auto

# C, F or auto (F in the US, C elsewhere).
temperature=auto

# --- Set on the TV: what's picked in the gear; "Upload config" fills these in ---
# Comma-separated app ids. The apps on Home, in this order (empty = the usual streaming apps that are installed).
shelf=
# The apps at the bottom of the YouTube tab, the same way (empty = the YouTube app).
youtube_shelf=
# Apps left out of Home and All Apps.
hide_apps=
# Home Assistant's entities, comma-separated: scenes, lights, power meters, washers and dryers, the guest network.
home_assistant_scenes=
home_assistant_lights=
home_assistant_power=
home_assistant_laundry=
home_assistant_guest_wifi=
# Idle minutes before the screensaver (0 = never; empty = 15), and minutes between its pictures (empty = 5).
saver_minutes=
saver_every=
# The YouTube playlist on Home, by id. Empty = the one called Frame TV.
youtube_playlist=

# --- Installing: for "Save, build and install" on the setup page; the app on the TV only gets setup_key ---
# The TV's IP address (on the TV: Settings → General → Network → Network Status → IP Settings).
tv_ip=
# The certificate profile that signs the app (tizen/make-certificate.sh makes it). Every update must use the same one.
sign_profile=
# Lets "Upload config" on the TV in. The setup page makes it at the first install; a new one needs a new install.
setup_key=
